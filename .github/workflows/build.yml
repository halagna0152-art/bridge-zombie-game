name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build the Game
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Godot APK
        uses: abarrak/godot-ci@v4
        with:
          name: bridge-zombie-game
          android: true
          
