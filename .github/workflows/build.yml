
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Zombie Bridge Game
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Project Files
        run: |
          test -f project.godot
          test -f export_presets.cfg

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . \
          --export-debug "Android" \
          build/android/bridge-zombie-game.apk

      - name: Check APK
        run: |
          test -f build/android/bridge-zombie-game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-zombie-game-apk
          path: build/android/bridge-zombie-game.apk
          if-no-files-found: error
          retention-days: 30
