name: "لعبة بناء جسر الزومبي"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Godot Android Game
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [resource]
          export/android/android_sdk_path = "/opt/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

      - name: Prepare Export Presets
        run: |
          grep -q 'keystore/release' export_presets.cfg || echo 'keystore/release=""' >> export_presets.cfg
          grep -q 'keystore/release_user' export_presets.cfg || echo 'keystore/release_user=""' >> export_presets.cfg
          grep -q 'keystore/release_password' export_presets.cfg || echo 'keystore/release_password=""' >> export_presets.cfg

      - name: Pre-heat Asset Cache
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --install-android-build-template --export-release "Android" build/android/game.apk
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/*.apk
