name: "لعبة بناء جسر الزومبي"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Godot Android Game
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK Components
        run: |
          export ANDROID_SDK_ROOT="/opt/android-sdk"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build Android APK
        run: |
          mkdir -p build/android
          export JAVA_HOME="/usr/lib/jvm/default-java"
          export ANDROID_SDK_ROOT="/opt/android-sdk"
          godot --headless --verbose --export-release "Android" build/android/game.apk
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/*.apk
