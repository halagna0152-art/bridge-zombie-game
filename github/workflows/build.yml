name: "بناء لعبة أندرويد - Godot 4"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: سحب الكود (Checkout)
        uses: actions/checkout@v4

      - name: إعداد مسارات Godot (SDK & Java)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [resource]
          export/android/android_sdk_path = "/opt/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

      - name: تجهيز إعدادات التصدير (تجنب خطأ Keystore)
        run: |
          grep -q 'keystore/debug' export_presets.cfg || echo 'keystore/debug=""' >> export_presets.cfg
          grep -q 'keystore/debug_user' export_presets.cfg || echo 'keystore/debug_user=""' >> export_presets.cfg
          grep -q 'keystore/debug_password' export_presets.cfg || echo 'keystore/debug_password=""' >> export_presets.cfg

      - name: تسخين المشروع واستيراد الموارد (Pre-heat)
        run: |
          godot --headless --import || true

      - name: تثبيت قالب بناء أندرويد
        run: |
          godot --headless --install-android-build-template

      - name: تصدير ملف APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/game.apk

      - name: رفع الملف الناتج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
